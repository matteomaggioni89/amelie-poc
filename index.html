<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laurameroni — Configuratori 3D</title>
  <meta name="description" content="Seleziona il prodotto da configurare: tavolo Talento o poltrona Amelie." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E30713;
      --ink: #1a1a1a;
      --grey: #767676;
      --line: #e5e2dd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Raleway", sans-serif;
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap { width: min(1240px, 92vw); margin: 0 auto; }

    header { padding: 44px 0 0; }
    .brand {
      font-family: "Raleway", sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: .42em;
      text-transform: uppercase;
    }
    .brand small {
      display: block;
      margin-top: 6px;
      font-weight: 400;
      font-size: 10.5px;
      letter-spacing: .3em;
      color: var(--grey);
    }

    main { flex: 1; display: flex; align-items: center; padding: 48px 0 56px; }
    .intro { margin-bottom: 34px; }
    .intro h1 {
      font-family: "Crimson Text", serif;
      font-weight: 400;
      font-size: clamp(34px, 4.6vw, 56px);
      line-height: 1.08;
    }
    .intro p {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--grey);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      background: #fff;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .card:hover { border-color: var(--ink); box-shadow: 0 14px 44px rgba(0,0,0,.08); }
    .card__media {
      aspect-ratio: 16 / 10.5;
      overflow: hidden;
      background: #f2f0ec;
    }
    .card__media img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .7s cubic-bezier(.22, .8, .3, 1);
    }
    .card:hover .card__media img { transform: scale(1.045); }
    .card__body {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px 22px;
      border-top: 1px solid var(--line);
    }
    .card__name {
      font-family: "Crimson Text", serif;
      font-weight: 400;
      font-size: 30px;
      line-height: 1;
    }
    .card__kind {
      display: block;
      margin-top: 7px;
      font-family: "Raleway", sans-serif;
      font-size: 11.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--grey);
    }
    .card__cta {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      transition: color .2s ease;
    }
    .card__cta::after { content: " \2192"; }
    .card:hover .card__cta { color: var(--red); }

    footer {
      padding: 18px 0 26px;
      border-top: 1px solid var(--line);
    }
    footer p {
      font-size: 10.5px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--grey);
    }

    @media (max-width: 760px) {
      header { padding-top: 30px; }
      main { padding: 34px 0 44px; }
      .cards { grid-template-columns: 1fr; gap: 20px; }
      .card__name { font-size: 26px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="brand">Laurameroni<small>Design Collection</small></p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="intro">
        <h1>Configuratori 3D</h1>
        <p>Seleziona il prodotto da configurare</p>
      </div>
      <div class="cards">
        <a class="card" href="products/talento/web/index.html">
          <div class="card__media">
            <img src="products/talento/web/cover.webp" alt="Tavolo Talento" width="1200" height="848" loading="eager" fetchpriority="high" decoding="async" />
          </div>
          <div class="card__body">
            <h2 class="card__name">Talento<span class="card__kind">Tavolo &middot; piano, gambe e inserto configurabili</span></h2>
            <span class="card__cta">Configura</span>
          </div>
        </a>
        <a class="card" href="products/amelie/web/index.html">
          <div class="card__media">
            <img src="products/amelie/web/cover.webp" alt="Poltrona Amelie" width="1200" height="844" loading="eager" fetchpriority="high" decoding="async" />
          </div>
          <div class="card__body">
            <h2 class="card__name">Amelie<span class="card__kind">Poltrona &middot; struttura e seduta configurabili</span></h2>
            <span class="card__cta">Configura</span>
          </div>
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p>POC configuratori &mdash; render layer-compositing in tempo reale</p>
    </div>
  </footer>
</body>
</html>
